name: Run Automation

on:
  repository_dispatch:
    types: [run-automation]
  workflow_dispatch:
    inputs:
      tg_msg_id:
        description: Telegram message ID to edit
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright pytz -q
          playwright install chromium --with-deps 2>&1 | tail -2

      - name: Update progress — Scraping
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, os
          token  = os.environ["TELEGRAM_BOT_TOKEN"]
          chat   = os.environ["TELEGRAM_CHAT_ID"]
          msg_id = os.environ.get("TG_MSG_ID", "")
          if not msg_id: exit(0)
          body = {"chat_id": chat, "message_id": int(msg_id),
                  "text": "⚙️ <b>بدأ العمل!</b>\n\n🔍 Scraping Google Maps...",
                  "parse_mode": "HTML"}
          try:
              urllib.request.urlopen(urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/editMessageText",
                  json.dumps(body).encode(), {"Content-Type": "application/json"}
              ), timeout=10)
          except: pass
          PYEOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MSG_ID: ${{ github.event.client_payload.tg_msg_id || inputs.tg_msg_id }}

      - name: Run scraper
        run: python3 scraper/scrape_maps.py

      - name: Check leads count
        id: check_leads
        run: |
          if [ -f scraper/today_leads.json ]; then
            COUNT=$(python3 -c "import json; print(len(json.load(open('scraper/today_leads.json'))))")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            if [ "$COUNT" -gt "0" ]; then
              echo "has_leads=true" >> $GITHUB_OUTPUT
            else
              echo "has_leads=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_leads=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Update progress — Generating
        if: steps.check_leads.outputs.has_leads == 'true'
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, os, pathlib
          token  = os.environ["TELEGRAM_BOT_TOKEN"]
          chat   = os.environ["TELEGRAM_CHAT_ID"]
          msg_id = os.environ.get("TG_MSG_ID", "")
          leads_file = pathlib.Path("scraper/today_leads.json")
          count = len(json.loads(leads_file.read_text(encoding="utf-8"))) if leads_file.exists() else 0
          if not msg_id: exit(0)
          body = {"chat_id": chat, "message_id": int(msg_id),
                  "text": f"⚙️ <b>بدأ العمل!</b>\n\n✅ Scraping terminé — {count} lead(s)\n🏗️ Génération des sites web...",
                  "parse_mode": "HTML"}
          try:
              urllib.request.urlopen(urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/editMessageText",
                  json.dumps(body).encode(), {"Content-Type": "application/json"}
              ), timeout=10)
          except: pass
          PYEOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MSG_ID: ${{ github.event.client_payload.tg_msg_id || inputs.tg_msg_id }}

      - name: Generate sites
        if: steps.check_leads.outputs.has_leads == 'true'
        run: |
          python3 generator/template_site.py \
            scraper/today_leads.json \
            /tmp/sites \
            --github-username "${{ secrets.GH_USERNAME }}"

      - name: Update progress — Deploying
        if: steps.check_leads.outputs.has_leads == 'true'
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, os, pathlib
          token  = os.environ["TELEGRAM_BOT_TOKEN"]
          chat   = os.environ["TELEGRAM_CHAT_ID"]
          msg_id = os.environ.get("TG_MSG_ID", "")
          leads_file = pathlib.Path("scraper/today_leads.json")
          count = len(json.loads(leads_file.read_text(encoding="utf-8"))) if leads_file.exists() else 0
          if not msg_id: exit(0)
          body = {"chat_id": chat, "message_id": int(msg_id),
                  "text": f"⚙️ <b>بدأ العمل!</b>\n\n✅ Scraping terminé — {count} lead(s)\n✅ Sites générés\n🚀 Déploiement GitHub Pages...",
                  "parse_mode": "HTML"}
          try:
              urllib.request.urlopen(urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/editMessageText",
                  json.dumps(body).encode(), {"Content-Type": "application/json"}
              ), timeout=10)
          except: pass
          PYEOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MSG_ID: ${{ github.event.client_payload.tg_msg_id || inputs.tg_msg_id }}

      - name: Deploy to GitHub Pages
        if: steps.check_leads.outputs.has_leads == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_CLASSIC_TOKEN }}
          GH_USER: ${{ secrets.GH_USERNAME }}
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib, subprocess, urllib.request

          token    = os.environ["GH_TOKEN"]
          username = os.environ["GH_USER"]
          leads    = json.loads(pathlib.Path("scraper/today_leads.json").read_text(encoding="utf-8"))
          subprocess.run(["git","config","--global","user.email","bot@franceleads.fr"])
          subprocess.run(["git","config","--global","user.name","France Leads Bot"])
          results = []

          for lead in leads:
              slug     = lead["slug"]
              site_dir = pathlib.Path(f"/tmp/sites/{slug}")
              if not (site_dir/"index.html").exists():
                  print(f"SKIP {slug}")
                  continue
              repo   = f"{slug}-site"
              remote = f"https://{token}@github.com/{username}/{repo}.git"
              subprocess.run(["git","init"], cwd=site_dir)
              subprocess.run(["git","add","-A"], cwd=site_dir)
              subprocess.run(["git","commit","-m",f"feat: {lead['name']}"], cwd=site_dir)
              subprocess.run(["git","remote","add","origin",remote], cwd=site_dir)
              try:
                  urllib.request.urlopen(urllib.request.Request(
                      "https://api.github.com/user/repos",
                      json.dumps({"name":repo,"private":False}).encode(),
                      {"Authorization":f"token {token}","Content-Type":"application/json",
                       "Accept":"application/vnd.github.v3+json"}), timeout=15)
              except: pass
              r = subprocess.run(["git","push","-u","origin","HEAD:main","--force"],
                                 cwd=site_dir, capture_output=True)
              if r.returncode != 0:
                  print(f"Push failed: {r.stderr.decode()[:200]}")
                  continue
              for method in ["POST","PUT"]:
                  try:
                      urllib.request.urlopen(urllib.request.Request(
                          f"https://api.github.com/repos/{username}/{repo}/pages",
                          json.dumps({"source":{"branch":"main","path":"/"}}).encode(),
                          {"Authorization":f"token {token}","Content-Type":"application/json",
                           "Accept":"application/vnd.github.v3+json"}, method=method), timeout=10)
                  except: pass
              url = f"https://{username}.github.io/{repo}"
              results.append({**lead, "url": url})
              print(f"Deployed: {url}")

          pathlib.Path("/tmp/results.json").write_text(json.dumps(results, ensure_ascii=False))
          PYEOF

      - name: Wait for GitHub Pages
        if: steps.check_leads.outputs.has_leads == 'true'
        run: sleep 60

      - name: Send final result & clean up progress message
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MSG_ID: ${{ github.event.client_payload.tg_msg_id || inputs.tg_msg_id }}
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os, pathlib

          token  = os.environ["TELEGRAM_BOT_TOKEN"]
          chat   = os.environ["TELEGRAM_CHAT_ID"]
          msg_id = os.environ.get("TG_MSG_ID", "")

          def tg(method, body):
              try:
                  urllib.request.urlopen(urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/{method}",
                      json.dumps(body).encode(), {"Content-Type": "application/json"}
                  ), timeout=10)
              except Exception as e:
                  print(f"TG {method} error: {e}")

          rf = pathlib.Path("/tmp/results.json")
          results = json.loads(rf.read_text()) if rf.exists() else []

          if not results:
              final = "ℹ️ لا توجد leads جديدة اليوم — كل المحلات لديها مواقع بالفعل.\n\nأرسل <b>إذهب</b> مجدداً غداً."
          else:
              final = f"✅ <b>اكتمل! {len(results)} موقع منشور اليوم</b>\n\n"
              for r in results:
                  final += (
                      f"🏢 <b>{r['name']}</b>\n"
                      f"📂 {r.get('category','')}  ⭐ {r.get('rating','')}/5\n"
                      f"📍 {r.get('address','')}\n"
                      f"📞 {r.get('phone','')}\n"
                      f"🌐 <a href='{r['url']}'>{r['url']}</a>\n\n"
                  )
              final += "💡 <i>لتفعيل لوحة الإدارة شغّل start_admin.bat على جهازك</i>"

          # Delete the progress message
          if msg_id:
              tg("deleteMessage", {"chat_id": chat, "message_id": int(msg_id)})

          # Send the clean final message
          tg("sendMessage", {"chat_id": chat, "text": final,
                             "parse_mode": "HTML", "disable_web_page_preview": False})
          print("Final message sent.")
          PYEOF
name: Run Automation

on:
  repository_dispatch:
    types: [run-automation]
  workflow_dispatch:
    inputs:
      tg_msg_id:
        description: Telegram message ID to edit
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright pytz -q
          playwright install chromium --with-deps 2>&1 | tail -3

      - name: Scrape Google Maps
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, os

          token  = os.environ["TELEGRAM_BOT_TOKEN"]
          chat   = os.environ["TELEGRAM_CHAT_ID"]
          msg_id = os.environ.get("TG_MSG_ID", "")

          def edit(text):
              if not msg_id: return
              body = {"chat_id": chat, "message_id": int(msg_id),
                      "text": text, "parse_mode": "HTML"}
              urllib.request.urlopen(urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/editMessageText",
                  json.dumps(body).encode(), {"Content-Type": "application/json"}
              ), timeout=10)

          edit("⚙️ <b>بدأ العمل!</b>\n\n📍 <i>مراحل العمل:</i>\n🔍 Scraping Google Maps...")
          PYEOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MSG_ID: ${{ github.event.client_payload.tg_msg_id || inputs.tg_msg_id }}

      - name: Run scraper
        run: python3 scraper/scrape_maps.py

      - name: Generate sites
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, os
          token  = os.environ["TELEGRAM_BOT_TOKEN"]
          chat   = os.environ["TELEGRAM_CHAT_ID"]
          msg_id = os.environ.get("TG_MSG_ID", "")
          if msg_id:
              body = {"chat_id": chat, "message_id": int(msg_id),
                      "text": "⚙️ <b>بدأ العمل!</b>\n\n📍 <i>مراحل العمل:</i>\n✅ Scraping terminé\n🏗️ Génération des sites web...",
                      "parse_mode": "HTML"}
              urllib.request.urlopen(urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/editMessageText",
                  json.dumps(body).encode(), {"Content-Type": "application/json"}
              ), timeout=10)
          PYEOF

          python3 generator/template_site.py \
            scraper/today_leads.json \
            /tmp/sites \
            --github-username "${{ secrets.GH_USERNAME }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MSG_ID: ${{ github.event.client_payload.tg_msg_id || inputs.tg_msg_id }}

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GH_CLASSIC_TOKEN }}
          GH_USER: ${{ secrets.GH_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MSG_ID: ${{ github.event.client_payload.tg_msg_id || inputs.tg_msg_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib, subprocess, urllib.request

          token    = os.environ["GH_TOKEN"]
          username = os.environ["GH_USER"]
          tg_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat     = os.environ["TELEGRAM_CHAT_ID"]
          msg_id   = os.environ.get("TG_MSG_ID", "")

          def edit(text):
              if not msg_id: return
              body = {"chat_id": chat, "message_id": int(msg_id), "text": text, "parse_mode": "HTML"}
              try:
                  urllib.request.urlopen(urllib.request.Request(
                      f"https://api.telegram.org/bot{tg_token}/editMessageText",
                      json.dumps(body).encode(), {"Content-Type": "application/json"}
                  ), timeout=10)
              except: pass

          edit("⚙️ <b>بدأ العمل!</b>\n\n📍 <i>مراحل العمل:</i>\n✅ Scraping terminé\n✅ Sites générés\n🚀 Déploiement GitHub Pages...")

          leads = json.loads(pathlib.Path("scraper/today_leads.json").read_text(encoding="utf-8"))
          subprocess.run(["git","config","--global","user.email","bot@franceleads.fr"])
          subprocess.run(["git","config","--global","user.name","France Leads Bot"])
          results = []

          for lead in leads:
              slug     = lead["slug"]
              site_dir = pathlib.Path(f"/tmp/sites/{slug}")
              if not (site_dir/"index.html").exists():
                  print(f"SKIP {slug}")
                  continue

              repo   = f"{slug}-site"
              remote = f"https://{token}@github.com/{username}/{repo}.git"

              subprocess.run(["git","init"], cwd=site_dir)
              subprocess.run(["git","add","-A"], cwd=site_dir)
              subprocess.run(["git","commit","-m",f"feat: {lead['name']}"], cwd=site_dir)
              subprocess.run(["git","remote","add","origin",remote], cwd=site_dir)

              try:
                  urllib.request.urlopen(urllib.request.Request(
                      "https://api.github.com/user/repos",
                      json.dumps({"name":repo,"private":False}).encode(),
                      {"Authorization":f"token {token}","Content-Type":"application/json",
                       "Accept":"application/vnd.github.v3+json"}), timeout=15)
              except: pass

              r = subprocess.run(["git","push","-u","origin","HEAD:main","--force"],
                                 cwd=site_dir, capture_output=True)
              if r.returncode != 0:
                  print(f"Push failed: {r.stderr.decode()[:200]}")
                  continue

              for method in ["POST","PUT"]:
                  try:
                      urllib.request.urlopen(urllib.request.Request(
                          f"https://api.github.com/repos/{username}/{repo}/pages",
                          json.dumps({"source":{"branch":"main","path":"/"}}).encode(),
                          {"Authorization":f"token {token}","Content-Type":"application/json",
                           "Accept":"application/vnd.github.v3+json"}, method=method), timeout=10)
                  except: pass

              url = f"https://{username}.github.io/{repo}"
              results.append({**lead, "url": url})
              print(f"Deployed: {url}")

          pathlib.Path("/tmp/results.json").write_text(json.dumps(results, ensure_ascii=False))
          PYEOF

      - name: Wait for GitHub Pages
        run: sleep 60

      - name: Send final results
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MSG_ID: ${{ github.event.client_payload.tg_msg_id || inputs.tg_msg_id }}
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os, pathlib

          token  = os.environ["TELEGRAM_BOT_TOKEN"]
          chat   = os.environ["TELEGRAM_CHAT_ID"]
          msg_id = os.environ.get("TG_MSG_ID", "")

          rf = pathlib.Path("/tmp/results.json")
          if not rf.exists() or not json.loads(rf.read_text()):
              final = "⚠️ Aucun nouveau site déployé aujourd'hui."
          else:
              results = json.loads(rf.read_text())
              final = f"✅ <b>اكتمل! {len(results)} موقع منشور</b>\n\n"
              for r in results:
                  final += (
                      f"🏢 <b>{r['name']}</b>\n"
                      f"📂 {r.get('category','')}  ⭐ {r.get('rating','')}/5\n"
                      f"📍 {r.get('address','')}\n"
                      f"📞 {r.get('phone','')}\n"
                      f"🌐 <a href='{r['url']}'>{r['url']}</a>\n\n"
                  )
              final += "💡 <i>Admin: شغّل start_admin.bat على جهازك</i>"

          # Edit the original message with final result
          if msg_id:
              body = {"chat_id": chat, "message_id": int(msg_id),
                      "text": final, "parse_mode": "HTML"}
              urllib.request.urlopen(urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/editMessageText",
                  json.dumps(body).encode(), {"Content-Type": "application/json"}
              ), timeout=10)
          else:
              body = {"chat_id": chat, "text": final, "parse_mode": "HTML"}
              urllib.request.urlopen(urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json.dumps(body).encode(), {"Content-Type": "application/json"}
              ), timeout=10)
          print("Done.")
          PYEOF
